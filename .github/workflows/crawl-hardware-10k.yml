name: Crawl 10k balanced hardware opportunities

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crawler/v2.py"
      - "crawler/v2_progress.py"
      - "crawler/v2_progress_entry.py"
      - "crawler/v2_progress_git.py"
      - "crawler/main.py"
      - "crawler/requirements.txt"
      - ".github/workflows/crawl-hardware-10k.yml"

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: hardware-opportunities-10k
  cancel-in-progress: true

jobs:
  crawl-10k:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r crawler/requirements.txt
      - name: Crawl with minute heartbeat and source checkpoints
        id: crawl
        continue-on-error: true
        run: python -u crawler/v2_progress_git.py --target 10500 --out output_v2
      - name: Package available output
        if: always()
        run: |
          mkdir -p output_v2
          cd output_v2
          zip -9 -r ../open-hardware-commercial-opportunities-10k.zip . || true
      - name: Publish run summary
        if: always()
        run: |
          echo '## 10k开源硬件商业化机会库' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_v2/progress.json ]; then
            echo '### 最后检查点' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output_v2/progress.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output_v2/summary.json ]; then
            echo '### 最终摘要' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output_v2/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Actions artifact or diagnostic checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-hardware-commercial-opportunities-10k
          path: |
            output_v2/
            open-hardware-commercial-opportunities-10k.zip
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
      - name: Publish permanent GitHub Release
        if: steps.crawl.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hardware-opportunities-10k-run-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            output_v2/开源硬件商业化机会库_10000条.xlsx \
            output_v2/hardware_opportunities.csv \
            output_v2/hardware_opportunities.jsonl \
            output_v2/source_status.csv \
            output_v2/score_distribution.csv \
            output_v2/summary.json \
            output_v2/SCORING_METHOD.md \
            output_v2/progress.json \
            open-hardware-commercial-opportunities-10k.zip \
            --title "开源硬件商业化机会库 10k · Run ${GITHUB_RUN_NUMBER}" \
            --notes-file output_v2/RELEASE_NOTES.md
      - name: Enforce quality gate
        if: steps.crawl.outcome != 'success'
        run: exit 1
