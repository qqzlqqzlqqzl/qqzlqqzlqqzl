name: Crawl 10k balanced hardware opportunities

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crawler/v2.py"
      - "crawler/main.py"
      - "crawler/requirements.txt"
      - "crawler/RUN_10K.md"
      - ".github/workflows/crawl-hardware-10k.yml"
  push:
    branches: [main]
    paths:
      - "crawler/v2.py"
      - "crawler/main.py"
      - "crawler/requirements.txt"
      - ".github/workflows/crawl-hardware-10k.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  crawl-10k:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r crawler/requirements.txt
      - name: Crawl, deduplicate, balance and score
        run: python crawler/v2.py --target 10500 --out output_v2
      - name: Package complete output
        run: |
          cd output_v2
          zip -9 -r ../open-hardware-commercial-opportunities-10k.zip .
      - name: Publish run summary
        if: always()
        run: |
          echo '## 10k开源硬件商业化机会库' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_v2/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output_v2/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-hardware-commercial-opportunities-10k
          path: |
            output_v2/
            open-hardware-commercial-opportunities-10k.zip
          retention-days: 90
          compression-level: 6
      - name: Publish permanent GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hardware-opportunities-10k-run-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            output_v2/开源硬件商业化机会库_10000条.xlsx \
            output_v2/hardware_opportunities.csv \
            output_v2/hardware_opportunities.jsonl \
            output_v2/source_status.csv \
            output_v2/score_distribution.csv \
            output_v2/summary.json \
            output_v2/SCORING_METHOD.md \
            open-hardware-commercial-opportunities-10k.zip \
            --title "开源硬件商业化机会库 10k · Run ${GITHUB_RUN_NUMBER}" \
            --notes-file output_v2/RELEASE_NOTES.md
