name: Watch hero-image pipeline every 15 minutes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watch-hero-image-pipeline
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect and recover latest production run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW_ID: "319360105"
          TARGET_BRANCH: "agent/full-hero-images-10500"
        shell: bash
        run: |
          set -euo pipefail

          api="/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW_ID}/runs?branch=${TARGET_BRANCH}&per_page=20"
          payload="$(gh api "$api")"
          run="$(jq -c '[.workflow_runs[] | select(.event == "workflow_dispatch" or .event == "pull_request")] | sort_by(.run_number) | last // empty' <<<"$payload")"

          if [[ -z "$run" ]]; then
            echo "No production run found for ${TARGET_BRANCH}."
            exit 1
          fi

          run_id="$(jq -r '.id' <<<"$run")"
          run_number="$(jq -r '.run_number' <<<"$run")"
          status="$(jq -r '.status' <<<"$run")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
          html_url="$(jq -r '.html_url' <<<"$run")"
          updated_at="$(jq -r '.updated_at' <<<"$run")"

          {
            echo "## Hero-image pipeline watchdog"
            echo "- Run: #${run_number} (${run_id})"
            echo "- Status: ${status}"
            echo "- Conclusion: ${conclusion:-n/a}"
            echo "- Updated: ${updated_at}"
            echo "- URL: ${html_url}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "run=${run_id} number=${run_number} status=${status} conclusion=${conclusion:-n/a}"

          case "$status" in
            queued|in_progress|waiting|requested|pending)
              echo "Production run is active; no intervention required."
              exit 0
              ;;
            completed)
              ;;
            *)
              echo "Unexpected run status: ${status}"
              exit 1
              ;;
          esac

          if [[ "$conclusion" == "success" ]]; then
            artifact_count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "full-hero-images-10500-fast" and .expired == false)] | length')"
            if [[ "$artifact_count" -lt 1 ]]; then
              echo "Run succeeded but final artifact is missing."
              exit 1
            fi
            echo "Run succeeded and the final artifact exists."
            exit 0
          fi

          if [[ "$conclusion" == "failure" || "$conclusion" == "timed_out" || "$conclusion" == "action_required" ]]; then
            echo "Retrying failed jobs for run ${run_id}."
            if ! gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs"; then
              echo "Failed-job retry was unavailable; retrying the whole run."
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun"
            fi
            exit 0
          fi

          if [[ "$conclusion" == "cancelled" || "$conclusion" == "stale" ]]; then
            echo "Retrying cancelled/stale run ${run_id}."
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun"
            exit 0
          fi

          echo "Completed with unhandled conclusion: ${conclusion}"
          exit 1
