name: Validate crawler

on:
  pull_request:
    paths:
      - "crawler/**"
      - "tests/**"
      - ".github/workflows/validate-crawler.yml"
      - "crawler/requirements.txt"
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "tests/**"
      - ".github/workflows/validate-crawler.yml"
      - "crawler/requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r crawler/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q crawler tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
