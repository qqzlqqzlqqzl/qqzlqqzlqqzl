name: Validate crawler

on:
  pull_request:
    paths:
      - "crawler/**"
      - "tests/**"
      - "scripts/**"
      - "windows/**"
      - "*.bat"
      - ".github/workflows/validate-crawler.yml"
      - "crawler/requirements.txt"
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "tests/**"
      - "scripts/**"
      - "windows/**"
      - "*.bat"
      - ".github/workflows/validate-crawler.yml"
      - "crawler/requirements.txt"

permissions:
  contents: read

jobs:
  validate-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r crawler/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q crawler tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  validate-windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @('windows/run.ps1', 'windows/check_result.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Dry-run crawler PowerShell entry
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File windows\run.ps1 -DryRun -NoPause
      - name: Dry-run result-checker PowerShell entry
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File windows\check_result.ps1 -DryRun -NoPause
      - name: Dry-run crawler BAT entry
        shell: cmd
        run: call RUN_WINDOWS.bat -DryRun -NoPause
      - name: Dry-run result-checker BAT entry
        shell: cmd
        run: call CHECK_RESULT_WINDOWS.bat -DryRun -NoPause
