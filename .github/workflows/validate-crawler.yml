name: Validate crawler

on:
  pull_request:
    paths:
      - "crawler/**"
      - "tests/**"
      - "scripts/**"
      - "windows/**"
      - "*.bat"
      - ".github/workflows/validate-crawler.yml"
      - "crawler/requirements.txt"
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "tests/**"
      - "scripts/**"
      - "windows/**"
      - "*.bat"
      - ".github/workflows/validate-crawler.yml"
      - "crawler/requirements.txt"

permissions:
  contents: read

jobs:
  validate-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r crawler/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q crawler tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  validate-windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry-run Windows launchers and capture output
        id: launchers
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force windows-ci | Out-Null
          cmd /c "RUN_WINDOWS.bat -DryRun -NoPause" *> windows-ci/run-windows.log
          $runCode = $LASTEXITCODE
          cmd /c "CHECK_RESULT_WINDOWS.bat -DryRun -NoPause" *> windows-ci/check-result.log
          $checkCode = $LASTEXITCODE
          "RUN_WINDOWS exit code: $runCode" | Tee-Object -FilePath windows-ci/status.txt
          "CHECK_RESULT_WINDOWS exit code: $checkCode" | Tee-Object -FilePath windows-ci/status.txt -Append
          Get-Content windows-ci/run-windows.log
          Get-Content windows-ci/check-result.log
          if ($runCode -ne 0 -or $checkCode -ne 0) { exit 1 }
      - name: Upload Windows launcher diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-diagnostics
          path: windows-ci/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Windows launcher validation
        if: steps.launchers.outcome != 'success'
        shell: powershell
        run: exit 1
