name: Validate crawler

on:
  pull_request:
    paths:
      - "crawler/**"
      - "tests/**"
      - "scripts/**"
      - "windows/**"
      - "*.bat"
      - ".github/workflows/validate-crawler.yml"
      - "crawler/requirements.txt"
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "tests/**"
      - "scripts/**"
      - "windows/**"
      - "*.bat"
      - ".github/workflows/validate-crawler.yml"
      - "crawler/requirements.txt"

permissions:
  contents: read

jobs:
  validate-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r crawler/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q crawler tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  validate-windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry-run crawler launcher
        shell: cmd
        run: RUN_WINDOWS.bat -DryRun -NoPause
      - name: Dry-run result checker
        shell: cmd
        run: CHECK_RESULT_WINDOWS.bat -DryRun -NoPause
