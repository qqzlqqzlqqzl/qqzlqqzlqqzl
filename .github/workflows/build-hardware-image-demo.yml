name: Build hardware-image demo assets

on:
  pull_request:
    paths:
      - "demo/hardware_image_demo_manifest.csv"
      - ".github/workflows/build-hardware-image-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Download and validate each exact repository image
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from PIL import Image

          root = Path('hardware_demo_assets')
          root.mkdir(exist_ok=True)
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github.raw+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hardware-image-demo-builder',
          }
          with open('demo/hardware_image_demo_manifest.csv', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          successes = 0
          for index, row in enumerate(rows, start=1):
              repo = row['repository']
              path = row['image_path']
              suffix = Path(path).suffix.lower() or '.img'
              safe = re.sub(r'[^A-Za-z0-9._-]+', '_', row['name']).strip('_')
              output = root / f'{index:02d}_{safe}{suffix}'
              api = f"https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              try:
                  response = requests.get(api, headers=headers, timeout=45)
                  response.raise_for_status()
                  output.write_bytes(response.content)
                  with Image.open(output) as image:
                      image.verify()
                  row['local_filename'] = output.name
                  row['download_status'] = 'success'
                  row['download_error'] = ''
                  successes += 1
                  print(f"[OK {index:02d}/{len(rows)}] {repo}/{path} -> {output} ({output.stat().st_size} bytes)", flush=True)
              except Exception as exc:
                  output.unlink(missing_ok=True)
                  row['local_filename'] = ''
                  row['download_status'] = 'failed'
                  row['download_error'] = f'{type(exc).__name__}: {exc}'
                  print(f"[FAIL {index:02d}/{len(rows)}] {repo}/{path}: {row['download_error']}", flush=True)

          fields = list(rows[0].keys())
          with open(root / 'manifest.csv', 'w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          (root / 'SUMMARY.txt').write_text(
              f'total={len(rows)}\nsuccess={successes}\nfailed={len(rows)-successes}\n',
              encoding='utf-8',
          )
          if successes < 6:
              raise SystemExit(f'Only {successes} verified images; need at least 6 for the demo')
          PY
      - name: Upload hardware-image demo assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-image-demo-assets
          path: hardware_demo_assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
