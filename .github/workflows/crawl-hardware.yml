name: Legacy crawl open-hardware opportunities

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r crawler/requirements.txt
      - name: Crawl and score legacy 4.1k dataset
        id: crawl
        continue-on-error: true
        run: python crawler/main.py --target 3600 --out output
      - name: Publish summary in job output
        if: always()
        run: |
          echo '## 旧版开源硬件机会库抓取结果' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload dataset artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-open-hardware-commercial-opportunities
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Enforce quality gate
        if: steps.crawl.outcome != 'success'
        run: exit 1
