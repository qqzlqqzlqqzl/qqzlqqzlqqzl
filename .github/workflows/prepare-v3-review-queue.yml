name: Prepare V3 manual review queue

on:
  push:
    branches:
      - agent/commercial-v3-strict-rebuild
    paths:
      - ".github/workflows/prepare-v3-review-queue.yml"
      - "manual_review/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: prepare-v3-review-queue
  cancel-in-progress: true

jobs:
  prepare-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/commercial-v3-strict-rebuild
          fetch-depth: 0

      - name: Download verified 10,500-row source package
        uses: actions/download-artifact@v4
        with:
          name: full-hero-images-10500-fast
          path: input
          run-id: 30068281842
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build next unreviewed Tindie queue
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          source = Path('input/final_output/hardware_opportunities_full_hero_images.csv')
          if not source.is_file():
              raise SystemExit(f'missing source: {source}')

          reviewed = set()
          for path in Path('manual_review').glob('batch_*.csv'):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  for row in csv.DictReader(f):
                      value = (row.get('project_id') or '').strip()
                      if value:
                          reviewed.add(value)

          with source.open(encoding='utf-8-sig', newline='') as f:
              source_rows = list(csv.DictReader(f))

          selected = []
          for row in source_rows:
              pid = (row.get('project_id') or '').strip()
              if not pid or pid in reviewed:
                  continue
              domain = (row.get('source_domain') or '').lower()
              platform = (row.get('platform') or '').lower()
              url = (row.get('url') or '').lower()
              if 'tindie' not in domain and 'tindie' not in platform and 'tindie.com' not in url:
                  continue
              selected.append(row)
              if len(selected) >= 20:
                  break

          fields = [
              'project_id','name','platform','url','source_domain','description','description_zh',
              'category','stars_or_support','market_validation','hardware_license',
              'normalized_commercial_score','hero_image_status','hero_image_source_url',
              'hero_image_local_filename'
          ]
          output = Path('manual_review/queue_next_20.csv')
          with output.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              writer.writerows(selected)

          print(f'reviewed={len(reviewed)} selected={len(selected)} output={output}')
          for row in selected:
              print(row.get('project_id'), row.get('name'), row.get('url'))
          PY

      - name: Commit refreshed queue
        shell: bash
        run: |
          if git diff --quiet -- manual_review/queue_next_20.csv && git ls-files --error-unmatch manual_review/queue_next_20.csv >/dev/null 2>&1; then
            echo "Queue unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_review/queue_next_20.csv
          git commit -m "chore: refresh next V3 manual review queue"
          git push origin HEAD:agent/commercial-v3-strict-rebuild
