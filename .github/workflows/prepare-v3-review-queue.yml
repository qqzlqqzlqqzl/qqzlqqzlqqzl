name: Prepare V3 manual review queue

on:
  push:
    branches:
      - agent/commercial-v3-strict-rebuild
    paths:
      - ".github/workflows/prepare-v3-review-queue.yml"
      - "manual_review/batch_*.csv"
      - "manual_review/deferred_*.csv"
      - "manual_review/PROGRESS.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: prepare-v3-review-queue
  cancel-in-progress: true

jobs:
  prepare-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/commercial-v3-strict-rebuild
          fetch-depth: 0

      - name: Download verified 10,500-row source package
        uses: actions/download-artifact@v4
        with:
          name: full-hero-images-10500-fast
          path: input
          run-id: 30068281842
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build next 200 unreviewed records across all platforms
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          source = Path('input/final_output/hardware_opportunities_full_hero_images.csv')
          if not source.is_file():
              raise SystemExit(f'missing source: {source}')

          excluded = set()
          for pattern in ('batch_*.csv', 'deferred_*.csv'):
              for path in Path('manual_review').glob(pattern):
                  with path.open(encoding='utf-8-sig', newline='') as f:
                      for row in csv.DictReader(f):
                          value = (row.get('project_id') or '').strip()
                          if value:
                              excluded.add(value)

          with source.open(encoding='utf-8-sig', newline='') as f:
              source_rows = list(csv.DictReader(f))

          # Keep source order for traceability. The queue is only a worklist;
          # no crawler score or keyword rule is allowed to become a commercial verdict.
          selected = []
          for row in source_rows:
              pid = (row.get('project_id') or '').strip()
              url = (row.get('url') or '').strip()
              if not pid or pid in excluded or not url:
                  continue
              selected.append(row)
              if len(selected) >= 200:
                  break

          fields = [
              'project_id','name','platform','url','source_domain','description','description_zh',
              'category','stars_or_support','market_validation','hardware_license',
              'normalized_commercial_score','hero_image_status','hero_image_source_url',
              'hero_image_local_filename'
          ]
          output = Path('manual_review/queue_next_200.csv')
          with output.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              writer.writerows(selected)

          platform_counts = Counter((row.get('platform') or 'unknown').strip() for row in selected)
          print(f'excluded={len(excluded)} selected={len(selected)} output={output}')
          print('platform_counts=', dict(platform_counts))
          for row in selected[:30]:
              print(row.get('project_id'), row.get('platform'), row.get('name'), row.get('url'))
          PY

      - name: Commit refreshed queue
        shell: bash
        run: |
          if git diff --quiet -- manual_review/queue_next_200.csv && git ls-files --error-unmatch manual_review/queue_next_200.csv >/dev/null 2>&1; then
            echo "Queue unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_review/queue_next_200.csv
          git commit -m "chore: refresh next 200 V3 review records"
          git push origin HEAD:agent/commercial-v3-strict-rebuild
